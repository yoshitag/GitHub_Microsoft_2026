<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung Dryer Issue Intake - Contractor Estimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f4efe6;
      --bg-2: #d6ece8;
      --card: #fffdf9;
      --ink: #15222a;
      --muted: #49606d;
      --line: #ccd7de;
      --accent: #0e7c86;
      --accent-2: #19426a;
      --warn: #a4431f;
      --ok: #1d7a3a;
      --shadow: 0 22px 60px rgba(23, 54, 65, 0.16);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 90% -10%, #b6e6d8 0%, transparent 60%),
        radial-gradient(900px 640px at -10% 20%, #ffd8b8 0%, transparent 65%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      width: min(1050px, 92vw);
      margin: 34px auto 60px;
      animation: reveal 550ms ease;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(130deg, #0f2f44, #0e7c86 65%, #16a57a);
      color: #f8feff;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: clamp(1.45rem, 2.5vw, 2.2rem);
      line-height: 1.1;
      letter-spacing: 0.2px;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      color: #d6f8ff;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      animation: reveal 500ms ease;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--accent-2);
    }

    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      padding: 10px 12px;
      color: var(--ink);
      font: inherit;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.4;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 124, 134, 0.16);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button,
    .btn-link {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      font: 600 0.92rem "IBM Plex Sans", "Segoe UI", sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 100ms ease, filter 100ms ease;
    }

    button:hover,
    .btn-link:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .primary {
      background: linear-gradient(125deg, #0b6f84, #155ca3);
      color: #f4fcff;
    }

    .secondary {
      background: #e7f2f4;
      color: #133748;
      border: 1px solid #c1d8de;
    }

    .danger {
      background: #f9ece8;
      color: var(--warn);
      border: 1px solid #edc9bf;
    }

    .preview {
      white-space: pre-wrap;
      background: #fbfeff;
      border: 1px dashed #b5c9d2;
      border-radius: 12px;
      padding: 12px;
      min-height: 150px;
      line-height: 1.45;
      color: #1e333d;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .status {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ok);
      min-height: 18px;
    }

    .footer {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #35505d;
      background: #f5fbfd;
      border: 1px solid #d7e8ee;
      border-radius: 11px;
      padding: 10px;
    }

    @media (max-width: 900px) {
      .row,
      .actions {
        grid-template-columns: 1fr;
      }

      .wrap {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Appliance Repair Bot</h1>
      <p>
        Step 2 of 2: fill in contractor estimate details and generate a share-ready summary.
      </p>
    </section>

    <section class="card">
      <h2>Contractor Estimate Fields</h2>

      <div class="row">
        <div class="field">
          <label for="estimate">Estimated cost range (USD)</label>
          <input id="estimate" type="text" placeholder="$200-$450" />
        </div>
        <div class="field">
          <label for="date">Earliest service date</label>
          <input id="date" type="date" />
        </div>
      </div>

      <div class="field">
        <label for="window">Arrival window</label>
        <input id="window" type="text" placeholder="Example: 10:00 AM - 12:00 PM" />
      </div>

      <div class="field">
        <label for="notes">Assumptions/exclusions/warranty notes</label>
        <textarea id="notes" placeholder="List assumptions and what is excluded."></textarea>
      </div>

      <div class="actions">
        <button class="primary" id="buildBtn" type="button">Build Share Summary</button>
        <button class="secondary" id="copyBtn" type="button">Copy Summary</button>
        <button class="danger" id="clearBtn" type="button">Clear Contractor Fields</button>
        <a class="btn-link secondary" href="index.html">Back to Homeowner Details</a>
      </div>

      <div class="status" id="status"></div>

      <div class="preview" id="preview">Your share-ready summary will appear here.</div>

      <div class="footer">
        Homeowner details are loaded from Step 1 when available.
      </div>
    </section>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);

    const contractorIds = ["estimate", "date", "window", "notes"];

    const getHomeowner = () => {
      try {
        const raw = localStorage.getItem("homeownerData");
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    };

    const buildSummary = () => {
      const homeowner = getHomeowner();
      const contractor = Object.fromEntries(contractorIds.map((id) => [id, byId(id).value.trim()]));

      const lines = [
        "Samsung Dryer Issue Intake",
        "",
        `Homeowner: ${homeowner.name || "-"}`,
        `Phone: ${homeowner.phone || "-"}`,
        `Email: ${homeowner.email || "-"}`,
        `Model: ${homeowner.model || "-"}`,
        `Serial: ${homeowner.serial || "-"}`,
        `Service Address: ${homeowner.address || "-"}`,
        "",
        "Issue Details:",
        `- Problem Summary: ${homeowner.summary || "-"}`,
        `- Noise Type: ${homeowner.noiseType || "-"}`,
        `- When Noise Occurs: ${homeowner.when && homeowner.when.length ? homeowner.when.join(", ") : "-"}`,
        `- Additional Symptoms: ${homeowner.symptoms && homeowner.symptoms.length ? homeowner.symptoms.join(", ") : "-"}`,
        `- Attached Media: ${homeowner.media || "No files attached"}`,
        "",
        "Contractor Response:",
        `- Estimated Cost: ${contractor.estimate || "Pending"}`,
        `- Earliest Date: ${contractor.date || "Pending"}`,
        `- Arrival Window: ${contractor.window || "Pending"}`,
        `- Notes: ${contractor.notes || "Pending"}`
      ];

      return lines.join("\n");
    };

    const updatePreview = () => {
      byId("preview").textContent = buildSummary();
    };

    byId("buildBtn").addEventListener("click", () => {
      updatePreview();
      byId("status").textContent = "Summary updated.";
    });

    byId("copyBtn").addEventListener("click", async () => {
      updatePreview();
      const text = byId("preview").textContent;
      try {
        await navigator.clipboard.writeText(text);
        byId("status").textContent = "Copied to clipboard.";
      } catch {
        byId("status").textContent = "Clipboard permission blocked. Select and copy manually.";
      }
    });

    byId("clearBtn").addEventListener("click", () => {
      contractorIds.forEach((id) => {
        byId(id).value = "";
      });
      byId("status").textContent = "Contractor fields cleared.";
      updatePreview();
    });

    updatePreview();
  </script>
</body>
</html>
