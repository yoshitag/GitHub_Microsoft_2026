<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung Dryer Issue Intake - Homeowner Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f4efe6;
      --bg-2: #d6ece8;
      --card: #fffdf9;
      --ink: #15222a;
      --muted: #49606d;
      --line: #ccd7de;
      --accent: #0e7c86;
      --accent-2: #19426a;
      --shadow: 0 22px 60px rgba(23, 54, 65, 0.16);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 90% -10%, #b6e6d8 0%, transparent 60%),
        radial-gradient(900px 640px at -10% 20%, #ffd8b8 0%, transparent 65%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      width: min(1050px, 92vw);
      margin: 34px auto 60px;
      animation: reveal 550ms ease;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(130deg, #0f2f44, #0e7c86 65%, #16a57a);
      color: #f8feff;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: clamp(1.45rem, 2.5vw, 2.2rem);
      line-height: 1.1;
      letter-spacing: 0.2px;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      color: #d6f8ff;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      animation: reveal 500ms ease;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--accent-2);
    }

    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      padding: 10px 12px;
      color: var(--ink);
      font: inherit;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.4;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 124, 134, 0.16);
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 8px 12px;
      margin-bottom: 10px;
      padding: 6px 0;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.93rem;
      color: #2a3e49;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-link {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      font: 600 0.92rem "IBM Plex Sans", "Segoe UI", sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 100ms ease, filter 100ms ease;
      background: linear-gradient(125deg, #0b6f84, #155ca3);
      color: #f4fcff;
    }

    .btn-link:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .small {
      font-size: 0.85rem;
      color: #55717d;
      margin-top: 6px;
    }

    .guide-status {
      margin-top: 8px;
      font-size: 0.86rem;
      color: #2f5766;
      min-height: 18px;
      white-space: pre-wrap;
    }

    .api-status {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1d7a3a;
      min-height: 18px;
    }

    .answer-box {
      white-space: pre-wrap;
      background: #fbfeff;
      border: 1px solid #d5e3ea;
      border-radius: 12px;
      padding: 12px;
      min-height: 120px;
      line-height: 1.45;
      color: #1e333d;
      margin-top: 8px;
    }

    .footer {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #35505d;
      background: #f5fbfd;
      border: 1px solid #d7e8ee;
      border-radius: 11px;
      padding: 10px;
    }

    @media (max-width: 900px) {
      .row {
        grid-template-columns: 1fr;
      }

      .wrap {
        margin-top: 20px;
      }

      .checks {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Samsung Dryer Noise Intake</h1>
      <p>
        Step 1 of 2: capture homeowner and issue details, then continue to the
        contractor estimate page.
      </p>
    </section>

    <section class="card">
      <h2>Homeowner Details</h2>

      <div class="row">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" placeholder="Your name" />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" type="tel" placeholder="(555) 555-5555" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input id="model" type="text" value="DVEA8800V/A3" />
        </div>
      </div>

      <div class="actions" style="margin-top: 4px;">
        <button class="btn-link" id="manualsBtn" type="button">Search User Guides (Manuals Downloader)</button>
      </div>
      <div class="guide-status" id="manualsStatus"></div>

      <div class="field">
        <label for="serial">Serial number</label>
        <input id="serial" type="text" placeholder="Optional" />
      </div>

      <div class="field">
        <label for="address">Service address</label>
        <textarea id="address" placeholder="Street, City, State, ZIP"></textarea>
      </div>

      <div class="field">
        <label for="summary">Problem summary (2-5 bullets or short paragraph)</label>
        <textarea id="summary" placeholder="Example: Grinding noise starts 2 min into cycle. Happens every cycle. Worse with heavy loads."></textarea>
      </div>

      <div class="field">
        <label for="noiseType">Primary noise type</label>
        <select id="noiseType">
          <option>Grinding</option>
          <option>Squeaking</option>
          <option>Thumping</option>
          <option>Rattling</option>
          <option>Buzzing/Humming</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>When does the noise occur?</label>
        <div class="checks" id="whenChecks">
          <label><input type="checkbox" value="At startup" />At startup</label>
          <label><input type="checkbox" value="During tumble" />During tumble</label>
          <label><input type="checkbox" value="During heating" />During heating</label>
          <label><input type="checkbox" value="Near cycle end" />Near cycle end</label>
          <label><input type="checkbox" value="Only with heavy loads" />Only with heavy loads</label>
          <label><input type="checkbox" value="Intermittent" />Intermittent</label>
        </div>
      </div>

      <div class="field">
        <label>Additional symptoms</label>
        <div class="checks" id="symptomChecks">
          <label><input type="checkbox" value="Burning smell" />Burning smell</label>
          <label><input type="checkbox" value="Excessive vibration" />Excessive vibration</label>
          <label><input type="checkbox" value="Dryer gets very hot" />Dryer gets very hot</label>
          <label><input type="checkbox" value="Long dry times" />Long dry times</label>
          <label><input type="checkbox" value="No heat" />No heat</label>
          <label><input type="checkbox" value="Error code displayed" />Error code displayed</label>
        </div>
      </div>

      <div class="field">
        <label for="media">Upload photos/videos</label>
        <input id="media" type="file" accept="image/*,video/*" multiple />
        <div class="small" id="fileCount">No files selected</div>
      </div>

      <div class="actions">
        <a class="btn-link" id="nextStepLink" href="contractor.html">Next Step: Contractor Estimate</a>
      </div>

      <div class="field" style="margin-top: 14px;">
        <label for="githubToken">GitHub token (for agent chat)</label>
        <input id="githubToken" type="password" placeholder="Paste your GitHub PAT here" autocomplete="off" />
      </div>

      <div class="actions" style="margin-top: 4px;">
        <button class="btn-link" id="askBtn" type="button">Ask Agent About This Submission</button>
      </div>

      <div class="api-status" id="apiStatus"></div>
      <div class="answer-box" id="apiAnswer">Agent response will appear here.</div>

      <div class="footer">
        Click Next Step to continue to the contractor details page.
      </div>
    </section>
  </main>

  <script>
    const API_ENDPOINT = "https://models.github.ai/inference/chat/completions";
    const API_MODEL = "openai/gpt-5";

    const homeownerIds = [
      "name",
      "phone",
      "email",
      "model",
      "serial",
      "address",
      "summary",
      "noiseType"
    ];

    const getCheckedValues = (containerId) => {
      return [...document.querySelectorAll(`#${containerId} input[type='checkbox']:checked`)].map((el) => el.value);
    };

    const getFilesText = () => {
      const files = document.getElementById("media").files;
      if (!files || files.length === 0) {
        return "No files attached";
      }
      return [...files].map((f) => `${f.name} (${Math.ceil(f.size / 1024)} KB)`).join(", ");
    };

    const buildHomeownerData = () => {
      const values = Object.fromEntries(homeownerIds.map((id) => [id, document.getElementById(id).value.trim()]));
      return {
        ...values,
        when: getCheckedValues("whenChecks"),
        symptoms: getCheckedValues("symptomChecks"),
        media: getFilesText()
      };
    };

    const buildAgentPrompt = (homeownerData) => {
      const lines = [
        "Samsung dryer intake submission:",
        `Homeowner: ${homeownerData.name || "-"}`,
        `Phone: ${homeownerData.phone || "-"}`,
        `Email: ${homeownerData.email || "-"}`,
        `Model: ${homeownerData.model || "-"}`,
        `Serial: ${homeownerData.serial || "-"}`,
        `Address: ${homeownerData.address || "-"}`,
        `Problem summary: ${homeownerData.summary || "-"}`,
        `Primary noise type: ${homeownerData.noiseType || "-"}`,
        `Noise occurs: ${homeownerData.when.length ? homeownerData.when.join(", ") : "-"}`,
        `Additional symptoms: ${homeownerData.symptoms.length ? homeownerData.symptoms.join(", ") : "-"}`,
        `Attached media: ${homeownerData.media}`,
        "",
        "Please provide: 1) likely causes, 2) top 3 follow-up diagnostic questions, and 3) recommended next repair steps."
      ];

      return lines.join("\n");
    };

    document.getElementById("media").addEventListener("change", () => {
      const files = document.getElementById("media").files;
      const fileCount = document.getElementById("fileCount");
      fileCount.textContent = !files || files.length === 0
        ? "No files selected"
        : `${files.length} file(s) selected`;
    });

    document.getElementById("manualsBtn").addEventListener("click", () => {
      const button = document.getElementById("manualsBtn");
      const model = document.getElementById("model").value.trim();
      const status = document.getElementById("manualsStatus");

      if (!model) {
        status.textContent = "Enter a model number first, then try again.";
        return;
      }

      button.disabled = true;
      status.textContent = "Searching and downloading user guide...";

      fetch("/api/manuals/search", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ model })
      })
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.error || "Manual search failed.");
          }

          status.textContent = `Downloaded locally: ${data.file.relativePath}\nSource: ${data.source.pdfUrl}`;
        })
        .catch((error) => {
          status.textContent = `Search failed: ${error.message}`;
        })
        .finally(() => {
          button.disabled = false;
        });
    });

    document.getElementById("nextStepLink").addEventListener("click", () => {
      const homeownerData = buildHomeownerData();
      localStorage.setItem("homeownerData", JSON.stringify(homeownerData));
    });

    document.getElementById("askBtn").addEventListener("click", async () => {
      const token = document.getElementById("githubToken").value.trim();
      const apiStatus = document.getElementById("apiStatus");
      const apiAnswer = document.getElementById("apiAnswer");

      if (!token) {
        apiStatus.textContent = "Add your GitHub token first.";
        return;
      }

      const homeownerData = buildHomeownerData();
      localStorage.setItem("homeownerData", JSON.stringify(homeownerData));
      const prompt = buildAgentPrompt(homeownerData);

      apiStatus.textContent = "Waiting for agent response...";
      apiAnswer.textContent = "Loading...";

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            model: API_MODEL,
            messages: [
              { role: "system", content: "You answer briefly and directly." },
              { role: "user", content: prompt }
            ]
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `Request failed with status ${response.status}`);
        }

        const data = await response.json();
        const content = data?.choices?.[0]?.message?.content || "No response text was returned.";
        apiAnswer.textContent = content;
        apiStatus.textContent = "Answer received.";
      } catch (error) {
        apiAnswer.textContent = "Unable to load the answer.";
        apiStatus.textContent = `Request failed: ${error.message}`;
      }
    });
  </script>
</body>
</html>
